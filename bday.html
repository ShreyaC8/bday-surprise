<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Sonali 💜</title>

    <!-- Cute Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="bdaystyle.css">
</head>

<body>

    <!-- ==========================================================
         Animated Background
         ========================================================== -->

    <div class="background">

        <div class="nebula"></div>

        <div class="stars"></div>
        <div class="twinkling-stars"></div>
        <div class="shooting-stars"></div>

        <div class="planet saturn"></div>
        <div class="planet moon"></div>

        <div class="floating-sparkles"></div>

        <div id="spaceObjects"></div>

    </div>


    <!-- ==========================================================
         Rocket
         (Animated by JavaScript)
         ========================================================== -->

    <div id="rocket">

        <div class="rocket-body">

            🚀

        </div>

        <div class="rocket-flame"></div>

    </div>



    <!-- ==========================================================
         Pixel Decorations
         ========================================================== -->

    <div class="pixel-decoration invader invader-left">
        👾
    </div>

    <div class="pixel-decoration invader invader-right">
        👾
    </div>

    <div class="pixel-decoration pixel-star star-one">⭐</div>
    <div class="pixel-decoration pixel-star star-two">⭐</div>
    <div class="pixel-decoration pixel-star star-three">⭐</div>



    <!-- ==========================================================
         Main Content
         ========================================================== -->

    <main>

        <section class="hero">

            <h1 class="title">

                <span>Happy Birthday!!!</span>

            </h1>

            <p class="subtitle">

                A little surprise is waiting...

            </p>


            <!-- Main Button -->

            <button
                id="surpriseButton"
                aria-label="Reveal Birthday Surprise">

                <span>Click Me 💜</span>

            </button>

        </section>




        <!-- ======================================================
             Birthday Card
             Hidden initially
             ====================================================== -->

        <section
            id="birthdayCard"
            class="hidden"
            aria-hidden="true">

            <div class="birthday-card">

                <!-- Sparkles -->

                <div class="card-sparkles"></div>


                <!-- ==================================================
                     Birthday Photo

                     Replace assets/photo.jpg
                     with your own image.
                     ================================================== -->

                <div class="photo-wrapper">

                    <img
                        src="bdayassets/photoCollage.jpg"
                        alt="Birthday photo"
                        id="birthdayPhoto">

                </div>


                <!-- Birthday Message -->

                <h2 id="birthdayMessage">

                    Happy Birthday BESTieee!
                </h2>

            </div>

        </section>

    </main>



    <!-- ==========================================================
         Confetti Canvas
         ========================================================== -->

    <canvas id="confettiCanvas"></canvas>




    <!-- ==========================================================
         Floating Hearts
         Generated by JavaScript
         ========================================================== -->

    <div id="heartsContainer"></div>




    <!-- ==========================================================
         Floating Sparkles
         Generated by JavaScript
         ========================================================== -->

    <div id="sparkleContainer"></div>




    <!-- ==========================================================
         Audio (Optional)

         Uncomment later if you want music.

         <audio
             id="backgroundMusic"
             loop>

             <source
                 src="assets/music.mp3"
                 type="audio/mpeg">

         </audio>

         ========================================================== -->




    <script src="bdayscript.js"></script>

</body>
</html>
